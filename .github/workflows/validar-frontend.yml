name: Aurora · escritura temporal de cambios (entrega 1)

on:
  push:
    branches:
      - ui/liquid-glass-aurora

permissions:
  contents: write

concurrency:
  group: aurora-escritura
  cancel-in-progress: false

# Flujo TEMPORAL. La vía de subida de archivos altera el código (lo normaliza
# como si fuera Markdown), así que los cambios viajan aquí como comentarios:
# este trabajo los escribe tal cual, comprueba la huella SHA-1 de cada archivo
# y solo entonces los publica en la rama; después compila y ejecuta las pruebas.
# Al terminar, este archivo vuelve a ser el flujo «Validar frontend BDP».
#
