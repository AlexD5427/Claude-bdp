#|+/* =============================================================
#|+   LIQUID GLASS AURORA — materia, luz y movimiento.
#|+
#|+   Todo lo de este bloque está FUERA de las capas de Tailwind a
#|+   propósito: son clases que se escriben desde los componentes y
#|+   fotogramas que nadie más declara, y así ningún purgado las quita.
#|+
#|+   Reglas de la casa, en orden:
#|+     1. Solo `transform`, `opacity` y degradados. Nada que obligue a
#|+        recalcular el diseño en cada fotograma.
#|+     2. Nada decorativo en bucle sobre el hilo principal: lo que se
#|+        repite (fondo, halo del logo, anillo del dock) vive en el
#|+        compositor; lo que repinta (brillos sobre texto) se ejecuta
#|+        una vez y se queda quieto.
#|+     3. Todo se apaga con `prefers-reduced-motion`, con «Reducir
#|+        movimiento» de Configuración y al imprimir.
#|+   ============================================================= */
#|+
#|+/* Variables animables del vidrio líquido. `inherits: false` no es un
#|+   detalle: al mover el puntero solo se recalcula el estilo del vidrio
#|+   iluminado, no el de los cientos de nodos que lleva dentro. */
#|+@property --glass-lit {
#|+  syntax: "<number>";
#|+  inherits: false;
#|+  initial-value: 0;
#|+}
#|+@property --glass-x {
#|+  syntax: "<length-percentage>";
#|+  inherits: false;
#|+  initial-value: 50%;
#|+}
#|+@property --glass-y {
#|+  syntax: "<length-percentage>";
#|+  inherits: false;
#|+  initial-value: 0%;
#|+}
#|+
#|+/* ---- Fondo aurora (CSS) -------------------------------------
#|+   Sustituye a las manchas con `blur(120–140px)`: un desenfoque de
#|+   ese radio sobre capas de 700 px que se mueven es de lo más caro
#|+   que puede pedirse a una GPU. Un degradado radial que se funde en
#|+   transparente da la misma mancha suave sin ningún filtro.
#|+   ------------------------------------------------------------ */
#|+.aurora-root {
#|+  background-color: var(--mesh-base);
#|+  contain: strict;
#|+}
#|+
#|+.aurora-blob {
#|+  position: absolute;
#|+  width: 62vmax;
#|+  height: 62vmax;
#|+  border-radius: 9999px;
#|+  will-change: transform;
#|+  animation: aurora-drift 26s ease-in-out infinite alternate;
#|+}
#|+.aurora-blob-1 {
#|+  top: -24vmax;
#|+  left: -18vmax;
#|+  background: radial-gradient(closest-side, var(--mesh-1), 45%, transparent);
#|+}
#|+.aurora-blob-2 {
#|+  top: 6vh;
#|+  right: -26vmax;
#|+  background: radial-gradient(closest-side, var(--mesh-2), 45%, transparent);
#|+  animation-duration: 31s;
#|+  animation-delay: -9s;
#|+}
#|+.aurora-blob-3 {
#|+  bottom: -34vmax;
#|+  left: 14vw;
#|+  width: 72vmax;
#|+  height: 72vmax;
#|+  background: radial-gradient(closest-side, var(--mesh-3), 45%, transparent);
#|+  animation-duration: 37s;
#|+  animation-delay: -17s;
#|+}
#|+.aurora-blob-4 {
#|+  top: 28vh;
#|+  left: 32vw;
#|+  width: 44vmax;
#|+  height: 44vmax;
#|+  background: radial-gradient(closest-side, var(--mesh-4), 45%, transparent);
#|+  animation-duration: 23s;
#|+  animation-delay: -5s;
#|+}
#|+
#|+@keyframes aurora-drift {
#|+  0% {
#|+    transform: translate3d(0, 0, 0) scale(1);
#|+  }
#|+  33% {
#|+    transform: translate3d(6vmax, -4vmax, 0) scale(1.12);
#|+  }
#|+  66% {
#|+    transform: translate3d(-4vmax, 5vmax, 0) scale(0.92);
#|+  }
#|+  100% {
#|+    transform: translate3d(3vmax, 2vmax, 0) scale(1.05);
#|+  }
#|+}
#|+
#|+/* Cortina de aurora: tres elipses de luz en diagonal que se mecen. */
#|+.aurora-ribbon {
#|+  position: absolute;
#|+  left: -25%;
#|+  right: -25%;
#|+  top: 2%;
#|+  height: 48%;
#|+  background:
#|+    radial-gradient(46% 30% at 28% 52%, var(--aurora-1), transparent 70%),
