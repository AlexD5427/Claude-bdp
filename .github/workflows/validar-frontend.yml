#|+}
#|+html.theme-vt::view-transition-new(root) {
#|+  z-index: 2;
#|+}
#|+/* Durante el revelado los colores saltan directamente a su valor final:
#|+   así el círculo descubre el tema terminado y no una mezcla a medias. */
#|+html.theme-vt *,
#|+html.theme-vt *::before,
#|+html.theme-vt *::after {
#|+  transition: none !important;
#|+}
#|+
#|+/* ---- Texto aurora ------------------------------------------- */
#|+.aurora-text {
#|+  color: var(--accent-fg);
#|+}
#|+@supports ((-webkit-background-clip: text) or (background-clip: text)) {
#|+  .aurora-text {
#|+    background-image: linear-gradient(
#|+      100deg,
#|+      var(--aurora-text-1) 0%,
#|+      var(--aurora-text-2) 35%,
#|+      var(--aurora-text-3) 65%,
#|+      var(--aurora-text-1) 100%
#|+    );
#|+    background-size: 220% 100%;
#|+    background-position: 0% 50%;
#|+    -webkit-background-clip: text;
#|+    background-clip: text;
#|+    -webkit-text-fill-color: transparent;
#|+    color: transparent;
#|+    text-shadow: none;
#|+    /* Dos pasadas y quieto: un brillo sobre texto repinta en cada
#|+       fotograma, así que no se deja en bucle. */
#|+    animation: aurora-pan 7s cubic-bezier(0.45, 0, 0.25, 1) 1.1s 2 alternate both;
#|+  }
#|+}
