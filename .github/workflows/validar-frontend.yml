#@ huella src/index.css 19e9aa1e1c4b84fd56736b3b09483a312bcd8e84

jobs:
  escribir:
    name: Escribir, verificar, publicar y validar (entrega 3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener el código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Escribir los archivos y comprobar sus huellas
        shell: python
        run: |
          import hashlib, os, subprocess, sys
          lineas = open(".github/workflows/validar-frontend.yml", encoding="utf-8").read().split("\n")
          archivos, parche, huellas, actual = [], [], [], None
          for linea in lineas:
              if linea.startswith("#@ "):
                  partes = linea[3:].split()
                  if partes[0] == "archivo":
                      actual = []
                      archivos.append((partes[1], partes[2], actual))
                  elif partes[0] == "parche":
                      actual = parche
                  elif partes[0] == "huella":
                      huellas.append((partes[1], partes[2]))
                      actual = None
              elif linea.startswith("#|") and actual is not None:
                  actual.append(linea[2:])
          def huella(datos):
              return hashlib.sha1(b"blob %d\0" % len(datos) + datos).hexdigest()
          for ruta, sha, contenido in archivos:
              os.makedirs(os.path.dirname(ruta), exist_ok=True)
              with open(ruta, "wb") as f:
                  f.write(("\n".join(contenido) + "\n").encode("utf-8"))
              huellas.append((ruta, sha))
          if parche:
              with open("/tmp/aurora.patch", "wb") as f:
                  f.write(("\n".join(parche) + "\n").encode("utf-8"))
              estricto = subprocess.run(["git", "apply", "--verbose", "/tmp/aurora.patch"])
              if estricto.returncode != 0:
                  print("Reintento ignorando diferencias de espacios en el contexto")
                  subprocess.run(["git", "apply", "--verbose", "--ignore-whitespace", "/tmp/aurora.patch"], check=True)
          fallos = 0
          for ruta, sha in huellas:
              real = huella(open(ruta, "rb").read())
              print(("OK " if real == sha else "DISTINTO ") + ruta + " " + real + " esperada " + sha)
              fallos += real != sha
          if fallos:
              sys.exit(str(fallos) + " archivo(s) no coinciden con su huella")
      - name: Publicar en la rama
        run: |
          git config user.name "AlexD5427"
          git config user.email "63507763+AlexD5427@users.noreply.github.com"
          git add -- src/index.css
          git diff --cached --stat
          git commit -m "Aurora: vidrio líquido optimizado, fondo aurora sin desenfoque, revelado al desplazar y accesibilidad"
          git push origin HEAD:refs/heads/ui/liquid-glass-aurora

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar para producción
        id: compilar
        continue-on-error: true
        run: npm run build

      - name: Ejecutar pruebas
        id: probar
        continue-on-error: true
        run: npm test

      - name: Veredicto
        if: steps.compilar.outcome != 'success' || steps.probar.outcome != 'success'
        run: |
          echo "::error::La compilación o las pruebas fallaron; los cambios ya están publicados en la rama"
          exit 1
