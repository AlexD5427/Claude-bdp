#|+   (menús, desplegables), diálogos, la rejilla del comparador y la
#|+   consola de Documentación, que tiene su propio lenguaje de
#|+   movimiento.
#|+   ------------------------------------------------------------ */
#|+@supports (animation-timeline: view()) {
#|+  @media (prefers-reduced-motion: no-preference) {
#|+    :where(html:not(.reduce-motion))
#|+      :where(main)
#|+      :where(
#|+        .glass:not(
#|+            .glass .glass,
#|+            .glass-heavy .glass,
#|+            .cmp-grid .glass,
#|+            .doc-console .glass,
#|+            .fixed .glass,
#|+            .sticky .glass,
#|+            [role="dialog"] .glass,
#|+            .absolute,
#|+            .fixed,
#|+            .sticky,
#|+            [role="menu"],
#|+            [role="listbox"],
#|+            [role="tooltip"]
#|+          )
#|+      ) {
#|+      animation: glass-reveal linear both;
#|+      animation-timeline: view();
#|+      animation-range: entry 0% entry 240px;
#|+      animation-range: entry 0% entry min(100%, 240px);
#|+    }
#|+  }
#|+}
#|+
#|+@keyframes glass-reveal {
#|+  from {
#|+    translate: 0 30px;
#|+    scale: 0.97;
#|+  }
#|+  to {
#|+    translate: none;
#|+    scale: none;
#|+  }
#|+}
#|+
#|+/* ---- Cambio de tema con revelado circular -------------------
#|+   El tema nuevo se abre en círculo desde el botón del dock (View
#|+   Transitions API). Solo actúa mientras dura el cambio de tema: las
